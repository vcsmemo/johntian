<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Tian</title>
<meta name="description" content="John Tian — Partner at Socle Partners (FunPlus). Investor, writer, builder.">
<meta property="og:title" content="John Tian">
<meta property="og:description" content="Partner at Socle Partners (FunPlus). Investor, writer, builder.">
<meta property="og:url" content="https://johntian-3hx.pages.dev">
<meta property="og:type" content="website">
<style>
  :root {
    --paper: #ffffff;
    --ink: #161616;
    --muted: #737373;
    --line: #ececec;
    --accent: #e8442e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101010;
      --ink: #f0f0f0;
      --muted: #9a9a9a;
      --line: #262626;
      --accent: #ff5a3c;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 18px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #fff; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 24px; }

  .top { display: flex; justify-content: flex-end; padding: 22px 0; }
  #lang-toggle {
    font: inherit; font-size: 14px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); padding: 5px 14px;
  }
  #lang-toggle:hover { border-color: var(--accent); color: var(--accent); }

  main { padding: 8vh 0 12vh; }
  h1 {
    font-size: clamp(2.6rem, 9vw, 4rem);
    letter-spacing: -0.035em; font-weight: 750; line-height: 1.05;
    margin-bottom: 6px;
  }
  .role { color: var(--muted); margin-bottom: 2.2em; max-width: 30em; }
  .role a { color: var(--ink); font-weight: 600; }
  p { margin-bottom: 1.4em; max-width: 34em; }
  p.muted { color: var(--muted); }
  a { color: var(--ink); text-decoration: underline;
    text-decoration-color: var(--line); text-underline-offset: 3px;
    text-decoration-thickness: 1px; }
  a:hover { color: var(--accent); text-decoration-color: var(--accent); }

  .reading { margin: 2.4em 0; }
  .reading .r-label { color: var(--muted); font-size: 15px; display: block; margin-bottom: 6px; }
  .reading ul { list-style: none; }
  .reading li { padding-left: 1.2em; text-indent: -1.2em; margin-bottom: 2px; color: var(--muted); }
  .reading li::before { content: "— "; color: var(--accent); }

  .photo { margin: 2.4em 0 1em; }
  .photo img { width: 100%; max-width: 340px; border-radius: 8px; display: block; }
  .photo figcaption { color: var(--muted); font-size: 13px; margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  footer { padding: 0 0 12vh; color: var(--muted); font-size: 14px; }
  footer .sep { margin: 0 10px; color: var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="lang-toggle" aria-label="switch language">中文</button>
  </div>

  <main>
    <h1>John Tian</h1>
    <p class="role" data-i18n="role"></p>

    <p data-i18n="p1"></p>
    <p data-i18n="p2"></p>
    <p class="muted" data-i18n="p3"></p>

    <div class="reading">
      <span class="r-label" data-i18n="r_label">Reading</span>
      <ul id="reading-list"></ul>
    </div>

    <div class="photo">
      <img src="garry-tan.jpg" alt="John Tian with Garry Tan">
      <figcaption data-i18n="photo_cap"></figcaption>
    </div>
    <p class="muted" data-i18n="personal"></p>
  </main>

  <footer>
    <span data-i18n="contact_label">Contact</span>
    <span class="sep">·</span><a href="#" id="email-link">Email</a>
    <span class="sep">·</span><a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">LinkedIn</a>
    <br><br>
    <span style="font-size:13px">© 2026 John Tian</span>
  </footer>
</div>

<script>
const I18N = {
  en: {
    role: 'Partner at <a href="https://www.soclepartners.com" target="_blank" rel="noopener">Socle Partners</a> (FunPlus) — investing globally in AI infrastructure and frontier AI.',
    p1: 'I write about AI startups at <a href="https://readthesignal.co" target="_blank" rel="noopener">The Signal</a> and <a href="https://vcsmemo.com" target="_blank" rel="noopener">Memo</a>, and run <a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">StartupBoy</a> — a Chinese newsletter read by 100,000+ founders and investors.',
    p2: 'I build small products with AI coding tools: <a href="https://arr.club" target="_blank" rel="noopener">arr.club</a> tracks ARR of AI and SaaS companies, <a href="https://vidsizer.com" target="_blank" rel="noopener">vidsizer.com</a> compresses video entirely in the browser.',
    p3: 'Previously: Editor-in-Chief at 36Kr (through its NASDAQ IPO), co-founder of Kr Space, Partner at UpHonest Capital, MD at InCapital. Early investor in GrubMarket.',
    r_label: 'Reading now',
    reading: [
      { title: '<em>The Power Law</em> — Sebastian Mallaby [sample]' },
      { title: '<em>Chip War</em> — Chris Miller [sample]' },
      { title: 'A recent Stratechery piece by Ben Thompson [sample]' }
    ],
    photo_cap: "With Garry Tan at YC's HQ, 2015.",
    personal: 'Father of one. Owned by two Maltese dogs.',
    contact_label: 'Contact'
  },
  zh: {
    role: '<a href="https://www.soclepartners.com" target="_blank" rel="noopener">Socle Partners</a>（FunPlus 旗下）合伙人 —— 在全球投资 AI 基础设施与前沿 AI。',
    p1: '我在 <a href="https://readthesignal.co" target="_blank" rel="noopener">The Signal</a> 和 <a href="https://vcsmemo.com" target="_blank" rel="noopener">Memo</a> 写关于 AI 创业的内容，运营<a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">投资实习所</a> —— 一个有 10 万+创始人与投资人订阅的中文创投通讯。',
    p2: '我用 AI 编程工具做小产品：<a href="https://arr.club" target="_blank" rel="noopener">arr.club</a> 追踪 AI 与 SaaS 公司的 ARR，<a href="https://vidsizer.com" target="_blank" rel="noopener">vidsizer.com</a> 在浏览器里压缩视频。',
    p3: '此前：36Kr 主编（经历纳斯达克上市）、氪空间联合创始人、UpHonest Capital 合伙人、盈动资本董事总经理。GrubMarket 早期投资人。',
    r_label: '最近在读',
    reading: [
      { title: '《The Power Law》—— Sebastian Mallaby [示例]' },
      { title: '《Chip War》—— Chris Miller [示例]' },
      { title: 'Ben Thompson 的一篇 Stratechery [示例]' }
    ],
    photo_cap: '2015 年，在 YC 美国总部和 Garry Tan。',
    personal: '一个孩子的父亲，被两只马尔济斯犬拥有。',
    contact_label: '联系'
  }
};

const toggle = document.getElementById("lang-toggle");
let lang = localStorage.getItem("jt-lang") || "en";

function renderReading() {
  const ul = document.getElementById("reading-list");
  if (!ul) return;
  ul.innerHTML = "";
  (I18N[lang].reading || []).forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = item.title;
    ul.appendChild(li);
  });
}

function renderEmail() {
  var u = "johntian2015", d = "gmail.com";
  var a = document.getElementById("email-link");
  if (a) { a.href = "mailto:" + u + "@" + d; a.textContent = u + "@" + d; }
}

function applyLang(l) {
  lang = l;
  document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (I18N[l][key] !== undefined) el.innerHTML = I18N[l][key];
  });
  toggle.textContent = l === "zh" ? "EN" : "中文";
  try { localStorage.setItem("jt-lang", l); } catch (e) {}
  renderReading();
  renderEmail();
}

toggle.addEventListener("click", () => applyLang(lang === "zh" ? "en" : "zh"));
applyLang(lang);
</script>
</body>
</html>
