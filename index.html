<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Tian</title>
<style>
  :root { --bg:#0a0a0a; --ink:#f4f4f4; --mut:#8a8a8a; --acc:#ff4d2e; --line:#222; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:900px; margin:0 auto; padding:0 28px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:26px 0; }
  .top .mark { font-weight:800; letter-spacing:-0.02em; }
  .top .mark em { font-style:normal; color:var(--acc); }
  #lang-toggle { font:inherit; font-size:13px; background:none; border:1px solid var(--line);
    color:var(--mut); border-radius:999px; padding:6px 16px; cursor:pointer; }
  #lang-toggle:hover { color:var(--acc); border-color:var(--acc); }
  .hero { padding:10vh 0 8vh; }
  .hero .k { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--acc);
    letter-spacing:.18em; text-transform:uppercase; margin-bottom:22px; }
  .hero h1 { font-size:clamp(2.8rem,9vw,6rem); line-height:1.04; letter-spacing:-0.04em; font-weight:800; }
  .hero h1 .dim { color:var(--mut); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--line); }
  .cell { padding:34px 30px 38px 0; border-bottom:1px solid var(--line); }
  .cell:nth-child(even) { padding-left:30px; border-left:1px solid var(--line); padding-right:0; }
  .cell .n { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mut); display:block; margin-bottom:10px; }
  .cell h3 { font-size:20px; letter-spacing:-0.01em; margin-bottom:8px; }
  .cell p, .cell li { color:var(--mut); font-size:16px; line-height:1.7; }
  .cell ul { list-style:none; }
  .cell li { margin-bottom:2px; }
  a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--acc); }
  a:hover { color:var(--acc); }
  .cell p a, .cell li a { color:var(--ink); }
  .photo { padding:44px 0 10px; display:flex; gap:28px; align-items:flex-end; flex-wrap:wrap; }
  .photo img { width:280px; border-radius:6px; display:block; filter:saturate(.85); }
  .photo figcaption { color:var(--mut); font-size:13px; font-family:ui-monospace,Menlo,monospace; margin-top:8px; }
  .photo .note { color:var(--mut); font-size:16px; max-width:300px; }
  footer { padding:40px 0 80px; color:var(--mut); font-size:14px; display:flex;
    justify-content:space-between; flex-wrap:wrap; gap:10px; }
  ::selection { background:var(--acc); color:#000; }
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} .cell:nth-child(even){border-left:none;padding-left:0;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="mark">JT<em>.</em></span><button id="lang-toggle">中文</button></div>
  <div class="hero">
    <div class="k" data-i18n="k">Investor · Writer · Builder</div>
    <h1><span data-i18n="h1a">Investing and</span><br><span class="dim" data-i18n="h1b">building globally.</span></h1>
  </div>
  <div class="grid">
    <div class="cell"><span class="n">01</span><h3 data-i18n="t1">Investing</h3><p data-i18n="p1"></p></div>
    <div class="cell"><span class="n">02</span><h3 data-i18n="t2">Writing</h3><p data-i18n="p2"></p></div>
    <div class="cell"><span class="n">03</span><h3 data-i18n="t3">Building</h3><p data-i18n="p3"></p></div>
    <div class="cell"><span class="n">04</span><h3 data-i18n="t4">Reading</h3><ul id="reading-list"></ul></div>
  </div>
  <div class="photo">
    <figure><img src="garry-tan.jpg" alt="John Tian with Garry Tan"><figcaption data-i18n="photo_cap"></figcaption></figure>
    <p class="note" data-i18n="personal"></p>
  </div>
  <footer><span><a href="#" id="email-link">Email</a> · <a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">LinkedIn</a></span><span>© 2026 John Tian</span></footer>
</div>
<script>
const I18N = {
  en: {
    k:"Investor · Writer · Builder", h1a:"Investing and", h1b:"building globally.",
    t1:"Investing", p1:'Partner at <a href="https://www.soclepartners.com" target="_blank" rel="noopener">Socle Partners</a> (FunPlus). Backing technical founders at inception — AI infra, foundation models. Early investor in GrubMarket.',
    t2:"Writing", p2:'<a href="https://readthesignal.co" target="_blank" rel="noopener">The Signal</a> · <a href="https://vcsmemo.com" target="_blank" rel="noopener">Memo</a> · <a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">StartupBoy</a> — 100,000+ founders and investors read along.',
    t3:"Building", p3:'<a href="https://arr.club" target="_blank" rel="noopener">arr.club</a> — ARR tracking. <a href="https://vidsizer.com" target="_blank" rel="noopener">vidsizer.com</a> — video compression. Built with AI coding tools.',
    t4:"Reading",
    reading:['<em>The Power Law</em> [sample]','<em>Chip War</em> [sample]','Stratechery [sample]'],
    photo_cap:"YC HQ, 2015 — with Garry Tan.",
    personal:"Previously: 36Kr (IPO), Kr Space, UpHonest, InCapital. Father of one, owned by two Maltese dogs."
  },
  zh: {
    k:"投资人 · 写作者 · 创造者", h1a:"在全球投资，", h1b:"在全球创造。",
    t1:"投资", p1:'<a href="https://www.soclepartners.com" target="_blank" rel="noopener">Socle Partners</a>（FunPlus 旗下）合伙人。在最早期的阶段支持技术创始人 —— AI 基础设施、基础模型。GrubMarket 早期投资人。',
    t2:"写作", p2:'<a href="https://readthesignal.co" target="_blank" rel="noopener">The Signal</a> · <a href="https://vcsmemo.com" target="_blank" rel="noopener">Memo</a> · <a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">投资实习所</a> —— 10 万+创始人与投资人在读。',
    t3:"创造", p3:'<a href="https://arr.club" target="_blank" rel="noopener">arr.club</a> —— ARR 追踪。<a href="https://vidsizer.com" target="_blank" rel="noopener">vidsizer.com</a> —— 视频压缩。用 AI 编程工具做的。',
    t4:"阅读",
    reading:['《The Power Law》[示例]','《Chip War》[示例]','Stratechery [示例]'],
    photo_cap:"2015，YC 美国总部 —— 和 Garry Tan。",
    personal:"此前：36Kr（上市）、氪空间、UpHonest、盈动资本。一个孩子的父亲，被两只马尔济斯犬拥有。"
  }
};
const toggle = document.getElementById("lang-toggle");
let lang = localStorage.getItem("jt-lang") || "en";
function renderReading(){ const ul=document.getElementById("reading-list"); if(!ul) return; ul.innerHTML="";
  (I18N[lang].reading||[]).forEach(t=>{ const li=document.createElement("li"); li.innerHTML=t; ul.appendChild(li); }); }
function renderEmail(){ var u="johntian2015", d="gmail.com"; var a=document.getElementById("email-link");
  if(a){ a.href="mailto:"+u+"@"+d; a.textContent=u+"@"+d; } }
function applyLang(l){ lang=l; document.documentElement.lang=l==="zh"?"zh-CN":"en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n");
    if(I18N[l][k]!==undefined) el.innerHTML=I18N[l][k]; });
  toggle.textContent=l==="zh"?"EN":"中文";
  try{localStorage.setItem("jt-lang",l);}catch(e){} renderReading(); renderEmail(); }
toggle.addEventListener("click",()=>applyLang(lang==="zh"?"en":"zh"));
applyLang(lang);
</script>
</body>
</html>
