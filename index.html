      "4. 从“帮你做事”走到“替你成交”，商业模式还没有定论。Instinct 的创始人说，平台每年的交易额接近 10 亿美元，其中一半来自旅行，这很像是在走“按成交抽佣”的路。Muse 走的则是订阅，按用量分档。两条路差别很大：订阅卖的是工具，抽佣卖的是结果，后者的天花板更高，但也会引出“Agent 到底在帮我还是在帮商家”的利益冲突。Instinct 目前没有公开收入，所以哪种模式能跑通，现在没人有答案。",
      "5. 从个人到人与人之间。Instinct 刚让 Agent 进群聊，每个人的 Agent 要先征得许可才能和群 Agent 连接，它还有一个“信任的人”网络，让 Agent 之间协调任务、安全地共享文件。想一想订餐、凑局、搬家、家庭日程，这些事本来就需要多个人协调。一个 Agent 帮你办事只是第一步，Agent 和 Agent 之间怎么谈、怎么对账，才是更大的想象空间。",
      "6. 没被覆盖的人群和市场。Muse 上线时只有美国，Instinct 还是邀请制，这意味着绝大多数人还没真正用上。不同语言、不同支付方式、不同生活习惯，通用产品很难一次覆盖。针对某一类人（比如带娃的父母、自由职业者、小店老板、老年人）或某一个地区做的个人 Agent，不需要和大厂拼通用能力，只需要比它们更懂这群人。",
      "最后一个提醒：大厂在分发和账号上有天然优势，Muse 背靠的是 Meta 的全部体量。创业公司能赢的地方，大概率是速度、信任和某个人群上的深度，而不是通用能力。Instinct 这个月估值翻了四倍，说明资本相信这条路走得通，但同时也说明预期已经被推得很高。这个品类才几周大，别太当真任何一个现在的结论，包括我这些。",
      "参考来源：TechCrunch《Meta debuts its Muse AI agent》(2026-09-08)；CNBC《Meta pushes into personal AI agents》(2026-09-08)；The Next Web《Meta launches Muse》；Fortune《Meet Noah Shinn》(2026-09-30)；Business Insider《Instinct joined the chat》(2026-10-06)；AI Weekly《Instinct opens its AI agent to group chats》(2026-10-06)；Ventureburn《Instinct raises $1 billion》；Vandata《Instinct AI, what a $10B personal agent teaches builders》。"
    ],
    body_en:[
      "My view is that personal agents haven't settled into a final shape yet, so the real room is in the product itself rather than in side businesses around it. I see six areas.",
      "1. The entry point is still open. Muse is an app plus WhatsApp. Instinct is text messages and phone calls. Both are finding buyers, which tells me nobody knows where an agent should live. Messaging apps, voice, glasses, watches, cars, even the inbox could each be the more natural front door for some group of people. Whoever finds the easiest door for a specific kind of person takes the position.",
      "2. Memory and personalization are the real moat. Models will converge and capability gaps will shrink, but how well an agent knows you doesn't transfer. Instinct's approach is to let the agent learn from its own written feedback, so it gets better with use. The team that gets \u201cremember the right things and use them correctly\u201d right will make switching painful for users. The hard parts are what to remember, what to forget, when to ask and when to just act, and nobody has nailed any of those yet.",
      "3. Trust is the product, not a feature. It decides whether people hand over their money and accounts at all. Muse gives each user an isolated virtual machine, and Instinct uses isolated sandboxes, short-lived credentials and a hallucination check before acting. But those are mostly engineering measures. The product questions are: how does a user know what the agent did, which actions must ask me first, and how do I undo a mistake or get compensated for one? Whoever makes this feel safe to ordinary people earns higher permissions, and higher permissions mean the agent can do more.",
      "4. From \u201cdoing things for you\u201d to \u201cclosing deals for you,\u201d and the business model is unsettled. Instinct's founder says the platform handles close to $1 billion a year in transactions, half of it travel. That looks like a take-rate model. Muse sells subscriptions tiered by usage. The two are very different: a subscription sells a tool, a commission sells outcomes. The latter has a higher ceiling but raises an awkward conflict: is the agent working for me or for the merchant? Instinct hasn't disclosed revenue, so no one can say yet which model works.",
      "5. From one person to people with each other. Instinct just put its agent into group chats, and each person's agent must grant permission before linking to the group's agent. It also has a trusted-person network where agents coordinate tasks and share files securely. Think of dinner plans, trips, moves, family schedules. These already require coordinating several people. One agent doing errands for you is step one. How agents negotiate and settle up with each other is the bigger canvas.",
      "6. People and markets nobody serves yet. Muse launched US-only and Instinct is invite-only, so most people haven't really used either. Different languages, payment systems and daily habits are hard for a general product to cover at once. A personal agent built for one kind of person (parents with young kids, freelancers, small shop owners, older adults) or one region doesn't need to beat the giants on general capability. It only needs to understand that group better than they do.",
      "One last caution: the big platforms have a natural edge in distribution and accounts, and Muse sits on Meta's full weight. Where a startup can win is probably speed, trust and depth with a specific group, not general capability. Instinct's valuation jumping fourfold in a month shows investors believe this path works, and also that expectations are already very high. The category is only weeks old, so don't take any conclusion too seriously, including mine.",
      "Sources: TechCrunch \u201cMeta debuts its Muse AI agent\u201d (2026-09-08); CNBC \u201cMeta pushes into personal AI agents\u201d (2026-09-08); The Next Web \u201cMeta launches Muse\u201d; Fortune \u201cMeet Noah Shinn\u201d (2026-09-30); Business Insider \u201cInstinct joined the chat\u201d (2026-10-06); AI Weekly \u201cInstinct opens its AI agent to group chats\u201d (2026-10-06); Ventureburn \u201cInstinct raises $1 billion\u201d; Vandata \u201cInstinct AI, what a $10B personal agent teaches builders\u201d."
    ] }
];
function renderWatch(){ const box=document.getElementById("watch-groups"); if(!box) return; box.innerHTML="";
  (I18N[lang].watch||[]).forEach(function(g){ const gd=document.createElement("div"); gd.className="watch-group";
    const h=document.createElement("h4"); h.textContent=g.g; gd.appendChild(h);
    const ul=document.createElement("ul"); ul.className="watch-list";
    g.items.forEach(function(it){ const li=document.createElement("li");
      li.innerHTML='<img class="co-logo" src="'+it.logo+'" alt=""> <a href="https://www.arr.club/'+it.slug+'" target="_blank" rel="noopener">'+it.name+'</a> <span class="role">— '+it.note+"</span>";
      ul.appendChild(li); });
    gd.appendChild(ul); box.appendChild(gd); }); }
function renderPrev(){ const ul=document.getElementById("prev-list"); if(!ul) return; ul.innerHTML="";
  (I18N[lang].prev||[]).forEach(function(it){ const li=document.createElement("li");
    li.innerHTML = (it.logo ? '<img class="co-logo" src="'+it.logo+'" alt="">' : "") + it.name + ' <span class="role">— ' + it.note + "</span>"; ul.appendChild(li); }); }
function renderNotes(){ const box=document.getElementById("notes-list"); if(!box) return; box.innerHTML="";  NOTES.forEach(function(n,i){ const d=document.createElement("details"); d.className="note-item"; if(i===0) d.open=true;
    const title=(lang==="en"&&n.title_en)?n.title_en:n.title;
    const body=(lang==="en"&&n.body_en)?n.body_en:n.body;
    const s=document.createElement("summary");
    s.innerHTML='<span class="date">'+n.date+'</span><br><h4>'+title+(n.sample?'<span class="sample-tag">'+(lang==="zh"?"示例":"sample")+'</span>':"")+'</h4>';
    d.appendChild(s);
    const b=document.createElement("div"); b.className="body";
    body.forEach(function(p){ const pe=document.createElement("p"); pe.textContent=p; b.appendChild(pe); });
    d.appendChild(b); box.appendChild(d); }); }
const toggle = document.getElementById("lang-toggle");
let lang = localStorage.getItem("jt-lang") || "en";
function renderBuilding(){ const ul=document.getElementById("building-list"); if(!ul) return; ul.innerHTML="";
  (I18N[lang].building||[]).forEach(t=>{ const li=document.createElement("li"); li.innerHTML=t; ul.appendChild(li); }); }
function renderReading(){ const ul=document.getElementById("reading-list"); if(!ul) return; ul.innerHTML="";
  (I18N[lang].reading||[]).forEach(t=>{ const li=document.createElement("li"); li.innerHTML=t; ul.appendChild(li); }); }
function renderEmail(){ var u="hi", d="johntian.me"; var a=document.getElementById("email-link");
  if(!a) return;
  var shown = u + " [at] " + d.replace(".", " [dot] ");
  var real = u + "@" + d;
  a.textContent = shown;
  a.href = "mailto:" + real;
  a.title = I18N[lang].copy_title;
  a.onclick = function(e){ e.preventDefault();
    var done = function(){ a.textContent = I18N[lang].copied;
      setTimeout(function(){ a.textContent = shown; }, 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(real).then(done, done); }
    else { done(); }
    setTimeout(function(){ window.location.href = "mailto:" + real; }, 400);
  };
}
function applyLang(l){ lang=l; document.documentElement.lang=l==="zh"?"zh-CN":"en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n");
    if(I18N[l][k]!==undefined) el.innerHTML=I18N[l][k]; });
  toggle.textContent=l==="zh"?"EN":"中文";
  try{localStorage.setItem("jt-lang",l);}catch(e){} renderBuilding(); renderReading(); renderNotes(); renderPrev(); renderWatch(); renderEmail(); }
toggle.addEventListener("click",()=>applyLang(lang==="zh"?"en":"zh"));
applyLang(lang);
</script>
