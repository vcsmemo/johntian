<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Tian</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#f0eee6; --ink:#141413; --mut:#6f6e68; --acc:#d97757; --line:#dcd7c9; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:900px; margin:0 auto; padding:0 28px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:26px 0; }
  .top img.logo { width:76px; height:76px; border-radius:50%; object-fit:cover; display:block;
    border:1px solid var(--line); }
  #lang-toggle { font:inherit; font-size:13px; background:none; border:1px solid var(--line);
    color:var(--mut); border-radius:999px; padding:6px 16px; cursor:pointer; }
  #lang-toggle:hover { color:var(--acc); border-color:var(--acc); }
  .hero { padding:10vh 0 8vh; }
  .hero .k { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--acc);
    letter-spacing:.18em; text-transform:uppercase; margin-bottom:22px; }
  .hero h1 { font-size:clamp(2.8rem,9vw,6rem); line-height:1.04; letter-spacing:-0.04em; font-weight:800; }
  .hero h1 .dim { color:var(--mut); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--line); }
  .cell { padding:34px 30px 38px 0; border-bottom:1px solid var(--line); }
  .cell:nth-child(even) { padding-left:30px; border-left:1px solid var(--line); padding-right:0; }
  .cell .n { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mut); display:block; margin-bottom:10px; }
  .cell h3 { font-size:20px; letter-spacing:-0.01em; margin-bottom:8px; }
  .cell p, .cell li { color:var(--mut); font-size:16px; line-height:1.7; }
  .cell ul { list-style:none; }
  .cell li { margin-bottom:2px; }
  a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--acc); }
  a:hover { color:var(--acc); }
  .cell p a, .cell li a { color:var(--ink); }
  .prev { border-top:1px solid var(--line); padding:34px 0 8px; }
  .prev .n { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mut); display:block; margin-bottom:10px; }
  .prev h3 { font-size:20px; letter-spacing:-0.01em; margin-bottom:6px; }
  .prev-grid { display:flex; gap:40px; align-items:flex-start; justify-content:space-between; }
  .prev-grid ul { list-style:none; flex:1; min-width:0; }
  .prev-grid li { padding:12px 0; border-bottom:1px solid var(--line); font-size:16.5px; }
  .prev-grid li:last-child { border-bottom:none; }
  .prev-grid li .role { color:var(--mut); }
  .prev-grid figure { flex-shrink:0; text-align:center; margin:0; padding-top:6px; }
  .prev-grid figure img { width:140px; height:140px; border-radius:50%; object-fit:cover; display:block;
    border:2px solid var(--line); margin:0 auto; }
  .prev-grid figcaption { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--mut);
    margin-top:10px; max-width:170px; line-height:1.5; }
  .prev .personal { font-style:italic; color:var(--mut); font-size:16px; margin:20px 0 34px; }
  .notes { border-top:1px solid var(--line); padding:34px 0 6px; }
  .notes .n { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mut); display:block; margin-bottom:10px; }
  .notes h3 { font-size:20px; letter-spacing:-0.01em; margin-bottom:4px; }
  .notes .hint { color:var(--mut); font-size:14px; margin-bottom:8px; }
  .note-item { border-bottom:1px solid var(--line); }
  .note-item summary { cursor:pointer; list-style:none; padding:16px 0; }
  .note-item summary::-webkit-details-marker { display:none; }
  .note-item .date { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mut); }
  .note-item h4 { font-size:17px; font-weight:600; margin-top:4px; display:inline; }
  .note-item summary:hover h4 { color:var(--acc); }
  .note-item .sample-tag { font-size:12px; color:var(--acc); border:1px solid var(--acc);
    border-radius:4px; padding:1px 7px; margin-left:8px; vertical-align:2px; white-space:nowrap; }
  .note-item .body { padding:2px 0 20px; }
  .note-item .body p { color:var(--mut); font-size:15.5px; line-height:1.75; margin-bottom:10px; max-width:44em; }
  footer { padding:40px 0 80px; color:var(--mut); font-size:14px; display:flex;
    justify-content:space-between; flex-wrap:wrap; gap:10px; }
  ::selection { background:var(--acc); color:#f0eee6; }
  @media (max-width:640px){ .grid{grid-template-columns:1fr;} .cell:nth-child(even){border-left:none;padding-left:0;} .prev-grid{flex-direction:column;gap:24px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img class="logo" src="avatar-cartoon.jpg" alt="John Tian"><button id="lang-toggle">中文</button></div>
  <div class="hero">
    <div class="k" data-i18n="k">Investor · Writer · Builder</div>
    <h1><span data-i18n="h1a">Investing and</span><br><span class="dim" data-i18n="h1b">building globally.</span></h1>
  </div>
  <div class="grid">
    <div class="cell"><span class="n">01</span><h3 data-i18n="t1">Investing</h3><p data-i18n="p1"></p></div>
    <div class="cell"><span class="n">02</span><h3 data-i18n="t2">Writing</h3><p data-i18n="p2"></p></div>
    <div class="cell"><span class="n">03</span><h3 data-i18n="t3">Building</h3><p data-i18n="p3"></p></div>
    <div class="cell"><span class="n">04</span><h3 data-i18n="t4">Reading</h3><ul id="reading-list"></ul></div>
  </div>
  <section class="notes">
    <span class="n">05</span>
    <h3 data-i18n="t5">Notes</h3>
    <p class="hint" data-i18n="notes_hint"></p>
    <div id="notes-list"></div>
  </section>
  <section class="prev">
    <span class="n">06</span>
    <h3 data-i18n="t6">Previously</h3>
    <div class="prev-grid">
      <ul id="prev-list"></ul>
      <figure>
        <img src="duo-cartoon.jpg" alt="John Tian with Garry Tan">
        <figcaption data-i18n="photo_cap"></figcaption>
      </figure>
    </div>
    <p class="personal" data-i18n="personal"></p>
  </section>
  <footer><span><a href="#" id="email-link">Email</a> · <a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">LinkedIn</a></span><span>© 2026 John Tian</span></footer>
</div>
<script>
const I18N = {
  en: {
    k:"Investor · Writer · Builder", h1a:"Investing and", h1b:"building globally.",
    t1:"Investing", p1:'Partner at <a href="https://www.soclepartners.com" target="_blank" rel="noopener">Socle Partners</a> (FunPlus). Backing technical founders at inception — AI infra, foundation models. Early investor in GrubMarket.',
    t2:"Writing", p2:'<a href="https://readthesignal.co" target="_blank" rel="noopener">The Signal</a> · <a href="https://vcsmemo.com" target="_blank" rel="noopener">Memo</a> · <a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">StartupBoy</a> — 100,000+ founders and investors read along.',
    t3:"Building", p3:'<a href="https://arr.club" target="_blank" rel="noopener">ARR.Club</a> — ARR tracking. <a href="https://vidsizer.com" target="_blank" rel="noopener">vidsizer.com</a> — video compression. Built with AI coding tools.',
    t4:"Reading",
    reading:['<em>The Power Law</em> [sample]','<em>Chip War</em> [sample]','Stratechery [sample]'],
    t5:"Notes", notes_hint:"Short essays, in Chinese or English. Newest first.",
    t6:"Previously",
    prev:[
      { name:'<a href="https://www.36kr.com" target="_blank" rel="noopener">36Kr</a> (IPO)', note:"Early founding team, Editor-in-Chief" },
      { name:'<a href="https://www.uphonestcapital.com" target="_blank" rel="noopener">UpHonest Capital</a>', note:"Partner" },
      { name:"InCapital", note:"Managing Director" }
    ],
    photo_cap:"With Garry Tan at YC's HQ, 2015.",
    personal:"Father of one, owned by two Maltese dogs."
  },
  zh: {
    k:"投资人 · 写作者 · 创造者", h1a:"在全球投资，", h1b:"在全球创造。",
    t1:"投资", p1:'<a href="https://www.soclepartners.com" target="_blank" rel="noopener">Socle Partners</a>（FunPlus 旗下）合伙人。在最早期的阶段支持技术创始人 —— AI 基础设施、基础模型。GrubMarket 早期投资人。',
    t2:"写作", p2:'<a href="https://readthesignal.co" target="_blank" rel="noopener">The Signal</a> · <a href="https://vcsmemo.com" target="_blank" rel="noopener">Memo</a> · <a href="https://www.linkedin.com/in/johntian" target="_blank" rel="noopener">投资实习所</a> —— 10 万+创始人与投资人在读。',
    t3:"创造", p3:'<a href="https://arr.club" target="_blank" rel="noopener">ARR.Club</a> —— ARR 追踪。<a href="https://vidsizer.com" target="_blank" rel="noopener">vidsizer.com</a> —— 视频压缩。用 AI 编程工具做的。',
    t4:"阅读",
    reading:['《The Power Law》[示例]','《Chip War》[示例]','Stratechery [示例]'],
    t5:"随笔", notes_hint:"短文随笔，中文英文都可以。新的在上面。",
    t6:"此前",
    prev:[
      { name:'<a href="https://www.36kr.com" target="_blank" rel="noopener">36Kr</a>（IPO）', note:"早期创始团队、主编" },
      { name:'<a href="https://www.uphonestcapital.com" target="_blank" rel="noopener">UpHonest Capital</a>', note:"合伙人" },
      { name:"盈动资本", note:"董事总经理" }
    ],
    photo_cap:"2015 年，在 YC 美国总部和 Garry Tan。",
    personal:"一个孩子的父亲，被两只马尔济斯犬拥有。"
  }
};
const NOTES = [
  { date:"2026-10-05", sample:true,
    title:"第一条笔记（示例）",
    body:["这是一条示例笔记，用来展示随笔区的样子。以后你写的东西都会以同样的格式出现在这里，新的排在上面。",
          "想加笔记时直接发消息给我就行——标题加正文，我来排版上线。"] }
];
function renderPrev(){ const ul=document.getElementById("prev-list"); if(!ul) return; ul.innerHTML="";
  (I18N[lang].prev||[]).forEach(function(it){ const li=document.createElement("li");
    li.innerHTML = it.name + ' <span class="role">— ' + it.note + "</span>"; ul.appendChild(li); }); }
function renderNotes(){ const box=document.getElementById("notes-list"); if(!box) return; box.innerHTML="";  NOTES.forEach(function(n,i){ const d=document.createElement("details"); d.className="note-item"; if(i===0) d.open=true;
    const s=document.createElement("summary");
    s.innerHTML='<span class="date">'+n.date+'</span><br><h4>'+n.title+(n.sample?'<span class="sample-tag">'+(lang==="zh"?"示例":"sample")+'</span>':"")+'</h4>';
    d.appendChild(s);
    const b=document.createElement("div"); b.className="body";
    n.body.forEach(function(p){ const pe=document.createElement("p"); pe.textContent=p; b.appendChild(pe); });
    d.appendChild(b); box.appendChild(d); }); }
const toggle = document.getElementById("lang-toggle");
let lang = localStorage.getItem("jt-lang") || "en";
function renderReading(){ const ul=document.getElementById("reading-list"); if(!ul) return; ul.innerHTML="";
  (I18N[lang].reading||[]).forEach(t=>{ const li=document.createElement("li"); li.innerHTML=t; ul.appendChild(li); }); }
function renderEmail(){ var u="hi", d="johntian.me"; var a=document.getElementById("email-link");
  if(a){ a.href="mailto:"+u+"@"+d; a.textContent=u+"@"+d; } }
function applyLang(l){ lang=l; document.documentElement.lang=l==="zh"?"zh-CN":"en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n");
    if(I18N[l][k]!==undefined) el.innerHTML=I18N[l][k]; });
  toggle.textContent=l==="zh"?"EN":"中文";
  try{localStorage.setItem("jt-lang",l);}catch(e){} renderReading(); renderNotes(); renderPrev(); renderEmail(); }
toggle.addEventListener("click",()=>applyLang(lang==="zh"?"en":"zh"));
applyLang(lang);
</script>
</body>
</html>
